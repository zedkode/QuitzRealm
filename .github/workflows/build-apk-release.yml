name: Build APK & Release

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔖 Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep 'version:' mobile/pubspec.yaml | head -1 | sed 's/version: //' | sed 's/+.*//')
          BUILD_NUMBER=$(grep 'version:' mobile/pubspec.yaml | head -1 | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION+$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: 🔍 Run analyzer
        run: |
          cd mobile
          flutter analyze

      - name: 🧪 Run tests
        run: |
          cd mobile
          flutter test --coverage 2>&1 || true

      - name: 📱 Build APK (debug)
        run: |
          cd mobile
          flutter build apk --debug \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: 📦 Build APK (release)
        run: |
          cd mobile
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: apk-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🏷️ Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}" || echo "Tag already exists"
          git push origin ${{ steps.version.outputs.tag }} || echo "Tag push failed (might already exist)"

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          echo "## QuizRealm v${{ steps.version.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Build:** ${{ steps.version.outputs.build_number }}" >> CHANGELOG.md
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> CHANGELOG.md
          echo "**Commit:** ${{ github.sha }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Changes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline -10 >> CHANGELOG.md || echo "No previous commits" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "QuizRealm v${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build_number }})"
          body_path: CHANGELOG.md
          files: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Post build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** APK debug & release uploaded" >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: 📢 Notify on completion
        run: |
          echo "✅ Build workflow completed"
          echo "Check the releases page: https://github.com/${{ github.repository }}/releases"
