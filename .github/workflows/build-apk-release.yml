name: Build APK & Release

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔖 Get version from pubspec.yaml
        id: version
        shell: bash
        run: |
          # Extract version line: version: 1.3.2+2006
          VERSION_LINE=$(grep -E '^version:' mobile/pubspec.yaml | head -1)
          echo "📦 Version line: $VERSION_LINE"
          
          # Parse version and build number using awk and cut
          VERSION=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f2)
          TAG="v${VERSION}+${BUILD_NUMBER}"
          
          echo "✓ VERSION=$VERSION"
          echo "✓ BUILD=$BUILD_NUMBER"  
          echo "✓ TAG=$TAG"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: 🔍 Run analyzer
        continue-on-error: true
        run: |
          cd mobile
          flutter analyze

      - name: 🧪 Run tests
        continue-on-error: true
        run: |
          cd mobile
          flutter test --coverage 2>&1

      - name: 📱 Build Debug APK
        id: build_debug
        run: |
          cd mobile
          echo "🏗️ Building debug APK..."
          flutter build apk --debug \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}
          
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "✅ Debug APK ready"
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          else
            echo "❌ ERROR: Debug APK not found!"
            find build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

      - name: 📱 Build Release APK
        id: build_release
        run: |
          cd mobile
          echo "🏗️ Building release APK..."
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✅ Release APK ready"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "❌ ERROR: Release APK not found!"
            find build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

      - name: 📤 Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds-${{ steps.version.outputs.tag }}
          path: mobile/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🏷️ Create Git Tag
        if: github.ref == 'refs/heads/main' && success()
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          TAG="${{ steps.version.outputs.tag }}"
          echo "🏷️ Creating tag: $TAG"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Tag already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || echo "Tag push failed"
            echo "✅ Tag created"
          fi

      - name: 📝 Generate Changelog
        id: changelog
        shell: bash
        run: |
          {
            echo "## QuizRealm v${{ steps.version.outputs.version }}"
            echo ""
            echo "**Build:** ${{ steps.version.outputs.build_number }}"
            echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Changes"
            echo ""
            git log --oneline -15 || echo "No commits yet"
            echo ""
            echo "---"
            echo "Auto-generated by GitHub Actions"
          } > CHANGELOG.md
          
          cat CHANGELOG.md

      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "QuizRealm v${{ steps.version.outputs.version }} Build ${{ steps.version.outputs.build_number }}"
          body_path: CHANGELOG.md
          files: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Post build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Build | ${{ steps.version.outputs.build_number }} |"
            echo "| Tag | ${{ steps.version.outputs.tag }} |"
            echo "| Status | ✅ Success |"
          } >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: 📢 Workflow Complete
        run: |
          echo "✅ Build completed!"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Tag: ${{ needs.build.outputs.tag }}"
